<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Restricted</title>
    <style>
        :root {
            --bg-color: #f4f5f6;
            --card-bg: rgba(255, 255, 255, 0.75);
            --text-main: #1a1a1a;
            --text-muted: #666666;
            --accent: #4f46e5;
            --border: rgba(0, 0, 0, 0.08);
            --blur: 20px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0b0f19;
                --card-bg: rgba(15, 23, 42, 0.65);
                --text-main: #f8fafc;
                --text-muted: #94a3b8;
                --accent: #6366f1;
                --border: rgba(255, 255, 255, 0.08);
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden;
            position: relative;
        }

        /* Анимированный фоновый градиент */
        .bg-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(99, 102, 241, 0) 70%);
            top: 20%;
            left: 20%;
            z-index: 1;
            animation: floatGlow 10s infinite alternate ease-in-out;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0); }
            100% { transform: translate(100px, 50px); }
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(var(--blur));
            -webkit-backdrop-filter: blur(var(--blur));
            border: 1px solid var(--border);
            padding: 40px 32px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04);
            max-width: 440px;
            width: 100%;
            text-align: center;
            z-index: 2;
            box-sizing: border-box;
        }

        /* Элемент радара / глобуса */
        .geo-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .radar-pulse {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid var(--accent);
            border-radius: 50%;
            opacity: 0.2;
            animation: pulse 2s infinite ease-out;
        }

        .radar-core {
            width: 48px;
            height: 48px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 8px 16px rgba(99, 102, 241, 0.3);
        }

        @keyframes pulse {
            0% { transform: scale(0.6); opacity: 0.8; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            margin: 0 0 12px 0;
            letter-spacing: -0.02em;
        }

        p {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
            margin: 0 0 24px 0;
        }

        /* Блок информации о пользователе */
        .user-meta {
            background: rgba(0, 0, 0, 0.02);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-around;
            margin-bottom: 28px;
        }

        @media (prefers-color-scheme: dark) {
            .user-meta { background: rgba(255, 255, 255, 0.02); }
        }

        .meta-item strong {
            display: block;
            color: var(--text-main);
            margin-top: 2px;
        }

        /* Интерактивная кнопка */
        .btn {
            background: var(--text-main);
            color: var(--bg-color);
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid transparent;
            border-top-color: currentColor;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="card">
        <div class="geo-icon">
            <div class="radar-pulse"></div>
            <div class="radar-core">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path><path d="M2 12h20"></path></svg>
            </div>
        </div>

        <h1>The service is unavailable in your region.</h1>
        <p>Access to this resource is restricted based on your current location. If you think this is a mistake, try changing your network connection.</p>

        <div class="user-meta">
            <div class="meta-item">Your IP: <strong id="user-ip">Loading...</strong></div>
            <div class="meta-item">Location: <strong id="user-geo">Detecting...</strong></div>
        </div>

        <button class="btn" onclick="checkConnection(this)">
            <span class="spinner" id="btn-spinner"></span>
            <span id="btn-text">Check Connection Again</span>
        </button>
    </div>

    <script>
        // Автоматическое определение IP и локации через публичное API
        async function fetchGeoData() {
            try {
                const response = await fetch('https://ipapi.co');
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('user-ip').textContent = data.ip || 'Unknown';
                    document.getElementById('user-geo').textContent = data.country_name || 'Restricted';
                } else {
                    throw new Error();
                }
            } catch (error) {
                document.getElementById('user-ip').textContent = 'Hidden';
                document.getElementById('user-geo').textContent = 'Unknown';
            }
        }

        // Анимация кнопки при нажатии
        function checkConnection(button) {
            const spinner = document.getElementById('btn-spinner');
            const text = document.getElementById('btn-text');
            
            button.disabled = true;
            spinner.style.display = 'block';
            text.textContent = 'Reconnecting...';

            setTimeout(() => {
                button.disabled = false;
                spinner.style.display = 'none';
                text.textContent = 'Check Connection Again';
                fetchGeoData(); // Обновляем данные при ручной проверке
            }, 2000);
        }

        // Запуск детекции при загрузке
        fetchGeoData();
    </script>
</body>
</html>
